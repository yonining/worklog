<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>워크로그</title>
  <meta name="theme-color" content="#3B5BDB">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="워크로그">
  <style>
    :root {
      --bg:         #F2F4F8;
      --surface:    #FFFFFF;
      --border:     #E0E4EF;
      --border-mid: #CDD3E4;
      --text-1:     #17192A;
      --text-2:     #5A607A;
      --text-3:     #97A0BE;
      --accent:     #3B5BDB;
      --accent-h:   #2F4AC5;
      --accent-dim: #EDF2FF;
      --t-c:        #1864AB;
      --t-dim:      #E7F5FF;
      --r:          10px;
      --r-sm:       6px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
      font-size: 15px;
      line-height: 1.6;
      color: var(--text-1);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
    }

    button { cursor: pointer; font-family: inherit; }

    .app {
      max-width: 660px;
      margin: 0 auto;
      min-height: 100%;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ─────────────────────────────── */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      height: 54px;
    }

    .wordmark {
      font-family: 'Courier New', Courier, monospace;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.04em;
      color: var(--text-3);
    }

    .wordmark em {
      font-style: normal;
      color: var(--accent);
    }

    .data-btn {
      background: none;
      border: none;
      font-size: 18px;
      line-height: 1;
      padding: 4px;
      border-radius: 6px;
      opacity: 0.6;
      transition: opacity .15s;
      margin-left: auto;
    }
    .data-btn:hover { opacity: 1; }

    .data-section-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-1);
      margin-bottom: 4px;
    }
    .data-desc {
      font-size: 13px;
      color: var(--text-2);
      margin-bottom: 10px;
      line-height: 1.55;
    }
    .data-action-btn {
      width: 100%;
      padding: 10px;
      border-radius: var(--r-sm);
      border: 1.5px solid var(--border);
      background: var(--surface);
      font-size: 13px;
      font-weight: 600;
      color: var(--text-1);
      cursor: pointer;
      transition: background .12s;
    }
    .data-action-btn:hover { background: var(--bg); }
    .data-textarea {
      width: 100%;
      height: 90px;
      border: 1.5px solid var(--border);
      border-radius: var(--r-sm);
      padding: 10px;
      font-size: 12px;
      font-family: 'Courier New', monospace;
      color: var(--text-2);
      resize: none;
      margin-bottom: 10px;
      background: var(--bg);
    }
    .data-textarea:focus { outline: none; border-color: var(--accent); }

    .md-month-list { display: flex; flex-direction: column; gap: 6px; }
    .md-year-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--text-3);
      text-transform: uppercase;
      padding: 4px 0 2px;
    }
    .md-month-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 12px;
      background: var(--bg);
      border-radius: var(--r-sm);
      border: 1px solid var(--border);
    }
    .md-month-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-1);
    }
    .md-month-count {
      font-size: 11px;
      color: var(--text-3);
    }
    .md-dl-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
      cursor: pointer;
      transition: background .12s;
    }
    .md-dl-btn:hover { background: var(--accent-dim); }

    .tab-bar {
      display: flex;
      padding: 0 20px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px 0;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-3);
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      transition: color .15s, border-color .15s;
      letter-spacing: 0.1px;
    }

    .tab-btn.on {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    /* ── Panels ──────────────────────────────── */
    .panel {
      flex: 1;
      padding: 20px;
      display: none;
    }

    .panel.on { display: block; }

    /* ── Date nav ────────────────────────────── */
    .date-nav {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 10px 12px;
      margin-bottom: 14px;
    }

    .nav-arrow {
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      border-radius: var(--r-sm);
      color: var(--text-2);
      font-size: 20px;
      transition: background .1s;
    }

    .nav-arrow:hover { background: var(--bg); }

    .date-center {
      flex: 1;
      text-align: center;
      position: relative;
      cursor: pointer;
      border-radius: var(--r-sm);
      padding: 2px 6px;
      transition: background .12s;
    }

    .date-center:hover { background: var(--bg); }

    .date-center-hint {
      position: absolute;
      right: 2px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 11px;
      color: var(--text-3);
      opacity: 0;
      transition: opacity .15s;
    }

    .date-center:hover .date-center-hint { opacity: 1; }

    /* ── Cal popup ─────────────────────────────── */
    .cal-pop {
      display: none;
      position: fixed;
      z-index: 300;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r);
      box-shadow: 0 8px 24px rgba(0,0,0,.12);
      padding: 14px;
      width: 280px;
      user-select: none;
    }
    .cal-pop.on { display: block; }

    .cal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .cal-head-label {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-1);
    }
    .cal-nav-btn {
      width: 28px; height: 28px;
      display: flex; align-items: center; justify-content: center;
      background: none; border: none;
      border-radius: var(--r-sm);
      color: var(--text-2);
      font-size: 16px;
      cursor: pointer;
    }
    .cal-nav-btn:hover { background: var(--bg); }

    .cal-dow-row {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
      margin-bottom: 4px;
    }
    .cal-dow {
      text-align: center;
      font-size: 10px;
      font-weight: 700;
      color: var(--text-3);
      padding: 3px 0;
      letter-spacing: .3px;
    }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
    }
    .cal-day {
      aspect-ratio: 1;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px;
      border-radius: 6px;
      cursor: pointer;
      color: var(--text-1);
      position: relative;
    }
    .cal-day:hover { background: var(--bg); }
    .cal-day.other-month { color: var(--text-3); }
    .cal-day.is-today { font-weight: 700; color: var(--accent); }
    .cal-day.is-today::after {
      content: '';
      position: absolute;
      bottom: 3px; left: 50%;
      transform: translateX(-50%);
      width: 4px; height: 4px;
      border-radius: 50%;
      background: var(--accent);
    }
    .cal-day.selected {
      background: var(--accent);
      color: #fff;
      font-weight: 700;
    }
    .cal-day.selected.is-today::after { background: #fff; }
    .cal-day.has-log::before {
      content: '';
      position: absolute;
      top: 4px; right: 4px;
      width: 4px; height: 4px;
      border-radius: 50%;
      background: var(--accent);
      opacity: .5;
    }
    .cal-day.selected.has-log::before { background: rgba(255,255,255,.6); }
    .cal-day.empty { cursor: default; pointer-events: none; }

    .date-label {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: var(--text-1);
    }

    .date-sub {
      font-size: 11px;
      color: var(--text-3);
      margin-top: 1px;
    }

    .today-pill {
      display: inline-block;
      background: var(--accent);
      color: white;
      font-size: 9px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 20px;
      vertical-align: middle;
      margin-left: 5px;
      letter-spacing: 0.5px;
    }

    /* ── Cards ───────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r);
      margin-bottom: 12px;
      overflow: hidden;
    }

    .card-body { padding: 12px 16px; }

    textarea {
      width: 100%;
      border: none;
      outline: none;
      resize: none;
      font-family: inherit;
      font-size: 14px;
      line-height: 1.65;
      color: var(--text-1);
      background: transparent;
    }

    textarea::placeholder { color: var(--text-3); }

    /* ── Checklist sections ──────────────────── */
    .cl-block {
      border-radius: var(--r);
      overflow: hidden;
      margin-bottom: 12px;
      border: 1px solid var(--border);
    }

    .cl-head {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 15px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    .cl-block.t .cl-head { background: var(--t-dim); color: var(--t-c); }

    .cl-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .cl-block.t .cl-dot { background: var(--t-c); }

    .cl-list { background: var(--surface); }

    /* ── Table layout ── */
    .cl-table-head {
      display: grid;
      grid-template-columns: 1fr 90px 90px 28px;
      border-bottom: 1px solid var(--border);
    }
    .cl-th {
      font-size: 11px;
      color: var(--text-3);
      font-weight: 600;
      padding: 7px 10px;
      letter-spacing: .3px;
    }
    .cl-th + .cl-th { border-left: 1px solid var(--border); text-align: center; }

    .cl-item {
      display: grid;
      grid-template-columns: 1fr 90px 90px 28px;
      align-items: stretch;
      border-bottom: 1px solid var(--border);
      transition: background .1s;
      min-height: 38px;
    }
    .cl-item:last-child { border-bottom: none; }
    .cl-item:hover { background: rgba(0,0,0,.018); }
    .cl-item:hover .cl-del { opacity: 1; }

    .cl-td {
      padding: 8px 10px;
      display: flex;
      align-items: center;
    }
    .cl-td-tag {
      border-left: 1px solid var(--border);
      padding: 6px 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .cl-td-del {
      border-left: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cl-itag {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 20px;
      cursor: pointer;
      white-space: nowrap;
      line-height: 1.5;
      max-width: 78px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cl-tag-slot {
      font-size: 11px;
      border: none;
      border-radius: 4px;
      padding: 2px 4px;
      color: var(--text-3);
      background: none;
      cursor: pointer;
      opacity: 0;
      transition: opacity .15s;
      white-space: nowrap;
    }
    .cl-item:hover .cl-tag-slot { opacity: .55; }
    .cl-tag-slot:hover { opacity: 1 !important; color: var(--accent); }

    .item-tag-input-wrap {
      position: fixed;
      z-index: 310;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 10px;
      display: none;
      flex-direction: column;
      gap: 6px;
      box-shadow: 0 8px 28px rgba(0,0,0,.12);
    }
    .item-tag-input-wrap.on { display: flex; }
    .item-tag-input {
      border: none;
      outline: none;
      background: var(--bg);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 13px;
      font-family: inherit;
      color: var(--text-1);
      width: 100%;
    }
    .item-tag-input::placeholder { color: var(--text-3); }
    .tag-pop-chips {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-height: 4px;
    }
    .tag-pop-chip {
      font-size: 13px;
      padding: 5px 14px;
      border-radius: 20px;
      cursor: pointer;
      border: none;
      font-family: inherit;
      line-height: 1.4;
      text-align: left;
      width: fit-content;
      white-space: nowrap;
      transition: filter .12s;
    }
    .tag-pop-chip:hover { filter: brightness(.93); }
    .tag-del-btn {
      background: none;
      border: none;
      color: var(--text-3);
      font-size: 14px;
      line-height: 1;
      padding: 2px 4px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .tag-del-btn:hover { color: #C92A2A; }

    .cl-text {
      flex: 1;
      font-size: 14px;
      line-height: 1.45;
      color: var(--text-1);
      cursor: text;
      min-width: 0;
      word-break: break-word;
    }

    .cl-edit-input {
      flex: 1;
      font: inherit;
      font-size: 14px;
      color: var(--text-1);
      background: transparent;
      border: none;
      border-bottom: 1.5px solid var(--accent);
      outline: none;
      padding: 0;
      line-height: 1.45;
      min-width: 0;
      width: 100%;
    }

    .cl-del {
      background: none;
      border: none;
      color: var(--text-3);
      font-size: 15px;
      line-height: 1;
      padding: 0 4px;
      opacity: 0;
      transition: opacity .15s;
      cursor: pointer;
    }
    .cl-del:hover { color: #C92A2A; opacity: 1; }

    .cl-add-row {
      display: grid;
      grid-template-columns: 1fr 90px 90px 28px;
      align-items: center;
      border-top: 1px solid var(--border);
    }

    .cl-input {
      border: none;
      outline: none;
      font-size: 14px;
      font-family: inherit;
      color: var(--text-1);
      background: transparent;
      padding: 9px 10px;
      width: 100%;
    }

    .cl-input::placeholder { color: var(--text-3); }


    /* ── Tags ────────────────────────────────── */
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 8px 4px 11px;
      border-radius: 20px;
      cursor: pointer;
      transition: filter .12s;
    }

    .chip:hover { filter: brightness(.94); }

    /* ── Tag popover ─────────────────────────── */
    .tag-pop {
      position: fixed;
      z-index: 500;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r);
      box-shadow: 0 8px 28px rgba(0,0,0,.14);
      padding: 10px;
      width: 188px;
      display: none;
    }

    .tag-pop.on { display: block; }

    .pop-name {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-1);
      padding: 2px 4px 8px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pop-del {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 7px 8px;
      background: none;
      border: none;
      border-radius: var(--r-sm);
      font-size: 13px;
      font-family: inherit;
      color: #C92A2A;
      cursor: pointer;
      margin-bottom: 6px;
      transition: background .1s;
    }

    .pop-del:hover { background: #FFF5F5; }

    .pop-colors-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-3);
      padding: 0 4px 4px;
    }

    .pop-color-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 6px;
      border-radius: var(--r-sm);
      cursor: pointer;
      transition: background .1s;
    }

    .pop-color-row:hover { background: var(--bg); }

    .pop-swatch {
      width: 18px;
      height: 18px;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .pop-color-name {
      font-size: 13px;
      color: var(--text-1);
      flex: 1;
    }

    .pop-check {
      font-size: 13px;
      color: var(--accent);
      width: 14px;
      text-align: center;
    }

    /* ── Memo tabs ───────────────────────────── */
    .memo-tabs {
      display: flex;
      gap: 2px;
      background: var(--bg);
      padding: 3px;
      border-radius: var(--r-sm);
      margin-bottom: 12px;
    }

    .memo-tab {
      flex: 1;
      padding: 6px 4px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-2);
      border: none;
      background: none;
      border-radius: 5px;
      transition: all .12s;
    }

    .memo-tab.on {
      background: var(--surface);
      color: var(--text-1);
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }

    /* ── Save bar ────────────────────────────── */
    .save-bar {
      position: sticky;
      bottom: 0;
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 14px 20px;
      padding-bottom: calc(14px + env(safe-area-inset-bottom));
    }

    .btn-save {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--r);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.2px;
      transition: background .15s, transform .1s;
    }

    .btn-save:hover { background: var(--accent-h); }
    .btn-save:active { transform: scale(.99); }
    .btn-save.ok { background: #2B8A3E; }


    .h-del-btn {
      background: none;
      border: none;
      color: var(--text-3);
      padding: 4px 6px;
      border-radius: var(--r-sm);
      cursor: pointer;
      transition: color .12s, background .12s;
      line-height: 1;
      font-size: 12px;
      font-weight: 600;
      font-family: inherit;
    }

    .h-del-btn:hover { color: #C92A2A; background: #FFF5F5; }
    .h-del-btn.confirming { color: #C92A2A; background: #FFF5F5; border: 1px solid #FFC9C9; padding: 3px 8px; }

    /* ── History ─────────────────────────────── */
    .filter-tag-chips {
      display: none;
      position: absolute;
      top: calc(100% + 4px);
      left: 0; right: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 10px;
      flex-wrap: wrap;
      gap: 6px;
      z-index: 100;
      box-shadow: 0 4px 16px rgba(0,0,0,.08);
    }
    .filter-tag-chips.on { display: flex; }

    .filter-tag-chip {
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: 1.5px solid transparent;
      transition: opacity .12s, border-color .12s;
    }
    .filter-tag-chip:hover { opacity: .8; }
    .filter-tag-chip.selected { border-color: var(--text-1); }

    .filter-field {
      flex: 1;
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      padding: 8px 12px;
      font-size: 13px;
      font-family: inherit;
      outline: none;
      color: var(--text-1);
      background: var(--bg);
      min-width: 0;
      transition: border-color .15s;
    }

    .filter-field:focus {
      border-color: var(--accent);
      background: var(--surface);
    }

    .h-entry {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 14px 16px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: border-color .15s, box-shadow .15s;
    }

    .h-entry:hover {
      border-color: var(--accent);
      box-shadow: 0 2px 12px rgba(59,91,219,.08);
    }

    .h-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 5px;
      gap: 8px;
    }

    .h-date {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-1);
      flex-shrink: 0;
    }

    .h-day {
      font-size: 12px;

<script>
// ─── Firebase ─────────────────────────────────────────────────────────────────
const firebaseConfig = {
  apiKey: "AIzaSyBMH4YOXAnS9IJbCer5DVUw9Ers2OuHmzI",
  authDomain: "worklog-61d3e.firebaseapp.com",
  projectId: "worklog-61d3e",
  storageBucket: "worklog-61d3e.firebasestorage.app",
  messagingSenderId: "876537882032",
  appId: "1:876537882032:web:6c6574be4cd6f8b228a275"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const DOC = db.collection('worklog').doc('data');

// ─── State ────────────────────────────────────────────────────────────────────
let curDate = (() => { const d = new Date(); d.setHours(0,0,0,0); return d; })();
let curTab  = 'input';
let tags    = [];
let logs    = {};  // { 'YYYY-MM-DD': logObj }
let knownTags = {}; // { name: { name, color } } — all tags ever used

// ─── Storage ──────────────────────────────────────────────────────────────────
const DEFAULT_TAGS = [
  { name: '비포',   color: 4, kind: 'project' },
  { name: '커플',   color: 0, kind: 'project' },
  { name: '그래픽', color: 2, kind: 'type' },
  { name: '운영',   color: 1, kind: 'type' },
  { name: 'QA',     color: 5, kind: 'type' },
];

function seedDefaultTags() {
  DEFAULT_TAGS.forEach((t, i) => {
    knownTags[t.name] = { name: t.name, color: t.color, kind: t.kind, createdAt: i + 1 };
  });
}

function assignCreatedAt() {
  const base = DEFAULT_TAGS.length + 1;
  Object.values(knownTags).filter(t => !t.createdAt).forEach((t, i) => {
    t.createdAt = base + i;
  });
}

async function load() {
  // 로컬 캐시 먼저 (빠른 초기 렌더링)
  try { const s = localStorage.getItem('wl_v1'); if (s) logs = JSON.parse(s); } catch(e) {}
  try { const s = localStorage.getItem('wl_tags'); if (s) knownTags = JSON.parse(s); } catch(e) {}
  assignCreatedAt();

  // Firestore에서 최신 데이터 불러오기
  try {
    const doc = await DOC.get();
    if (doc.exists) {
      const data = doc.data();
      if (data.logs) logs = data.logs;
      if (data.knownTags) knownTags = data.knownTags;
      // knownTags가 완전히 비어있을 때만 기본 태그 심기
      if (Object.keys(knownTags).length === 0) seedDefaultTags();
      assignCreatedAt();
      localStorage.setItem('wl_v1', JSON.stringify(logs));
      localStorage.setItem('wl_tags', JSON.stringify(knownTags));
      persistTags();
      refreshDateUI();
      loadEntry();
      drawHistory();
    } else {
      // Firestore에 데이터 없음 = 최초 설치
      seedDefaultTags();
      persistTags();
    }
  } catch(e) { console.warn('Firestore 불러오기 실패, 로컬 사용:', e); }

  // 다른 기기에서 저장 시 실시간 반영 (입력 중인 UI는 건드리지 않음)
  DOC.onSnapshot(snap => {
    if (!snap.exists) return;
    const data = snap.data();
    if (data.logs) { logs = data.logs; localStorage.setItem('wl_v1', JSON.stringify(logs)); }
    if (data.knownTags) { knownTags = data.knownTags; localStorage.setItem('wl_tags', JSON.stringify(knownTags)); }
    drawHistory();
    if (curTab === 'perf') drawPerfReport();
  }, e => console.warn('Firestore 실시간 오류:', e));
}

function persist() {
  try { localStorage.setItem('wl_v1', JSON.stringify(logs)); } catch(e) {}
  DOC.set({ logs, knownTags }).catch(e => console.warn('Firestore 저장 실패:', e));
}

function persistTags() {
  try { localStorage.setItem('wl_tags', JSON.stringify(knownTags)); } catch(e) {}
  DOC.update({ knownTags }).catch(e => console.warn('Firestore 저장 실패:', e));
}

// ─── Date helpers ─────────────────────────────────────────────────────────────
const DAYS = ['일요일','월요일','화요일','수요일','목요일','금요일','토요일'];

function key(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function koDate(d) {
  return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일`;
}

function koDow(d) {
  const today = new Date(); today.setHours(0,0,0,0);
  const delta = Math.round((d - today) / 86400000);
  const dow = DAYS[d.getDay()];
  if (delta === 0)  return dow + ' · 오늘';
  if (delta === -1) return dow + ' · 어제';
  if (delta === 1)  return dow + ' · 내일';
  return dow;
}

function isToday(d) {
  const t = new Date(); t.setHours(0,0,0,0);
  return d.getTime() === t.getTime();
}

// ─── Date navigation ──────────────────────────────────────────────────────────
function shiftDate(n) {
  const prevKey = key(curDate);
  let d = new Date(curDate.getTime());
  const step = n > 0 ? 1 : -1;
  let moved = 0;
  while (moved < Math.abs(n)) {
    d = new Date(d.getTime() + step * 86400000);
    const dow = d.getDay();
    if (dow !== 0 && dow !== 6) moved++;
  }
  curDate = d;
  const nextKey = key(curDate);

  // 다음날로 이동 시, 오늘 한 일 → 다음날 전날 한 일 자동 채우기
  if (n > 0) {
    const prev = logs[prevKey];
    const next = logs[nextKey];
    const prevTItems = prev?.tItems || [];
    const nextYItems = next?.yItems || [];
    if (prevTItems.length && !nextYItems.length) {
      logs[nextKey] = {
        ...(next || { date: nextKey, t: [], tItems: [], tags: [], memo: {} }),
        y: prevTItems.map(i => i.text),
        yItems: prevTItems.map(i => ({ ...i, done: false })),
      };
      persist();
    }
  }

  refreshDateUI();
  loadEntry();
}

function refreshDateUI() {
  document.getElementById('d-label').innerHTML =
    x(koDate(curDate)) + (isToday(curDate) ? ' <span class="today-pill">TODAY</span>' : '');
  document.getElementById('d-sub').textContent = koDow(curDate);
}

let calYear, calMonth;

function openCalPop(e) {
  e.stopPropagation();
  calYear = curDate.getFullYear();
  calMonth = curDate.getMonth();
  renderCal();
  const pop = document.getElementById('cal-pop');
  pop.classList.add('on');
  const rect = document.getElementById('d-label').getBoundingClientRect();
  const popW = 280;
  let left = rect.left + rect.width / 2 - popW / 2;
  left = Math.max(8, Math.min(left, window.innerWidth - popW - 8));
  pop.style.left = left + 'px';
  pop.style.top = (rect.bottom + 6) + 'px';
}

function closeCalPop() {
  document.getElementById('cal-pop').classList.remove('on');
}

function calShiftMonth(n) {
  calMonth += n;
  if (calMonth > 11) { calMonth = 0; calYear++; }
  if (calMonth < 0)  { calMonth = 11; calYear--; }
  renderCal();
}

function renderCal() {
  const todayKey = key(new Date());
  const selKey = key(curDate);
  document.getElementById('cal-label').textContent = `${calYear}년 ${calMonth + 1}월`;

  const firstDay = new Date(calYear, calMonth, 1).getDay(); // 0=Sun
  const startOffset = firstDay === 0 ? 6 : firstDay - 1;   // Mon=0
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();

  let html = '';
  for (let i = 0; i < startOffset; i++) {
    html += `<div class="cal-day empty"></div>`;
  }
  for (let d = 1; d <= daysInMonth; d++) {
    const dk = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dow = new Date(calYear, calMonth, d).getDay();
    const cls = [
      'cal-day',
      dk === todayKey ? 'is-today' : '',
      dk === selKey   ? 'selected' : '',
      logs[dk]        ? 'has-log'  : '',
      (dow === 0 || dow === 6) ? 'weekend' : '',
    ].filter(Boolean).join(' ');
    const col = dow === 6 ? 'color:#1864AB' : dow === 0 ? 'color:#C92A2A' : '';
    const selStyle = dk === selKey ? '' : col ? `style="${col}"` : '';
    html += `<div class="${cls}" ${selStyle} onclick="pickCalDay('${dk}')">${d}</div>`;
  }
  document.getElementById('cal-grid').innerHTML = html;
}

function pickCalDay(dk) {
  const [y, m, d] = dk.split('-').map(Number);
  curDate = new Date(y, m - 1, d);
  curDate.setHours(0, 0, 0, 0);
  refreshDateUI();
  loadEntry();
  closeCalPop();
}

// ─── Checklist ────────────────────────────────────────────────────────────────
let items = { y: [], t: [] }; // [{ text, done, level }]

function tagSlot(sec, i, item, kind) {
  const t = item[tagField(kind)];
  if (t) {
    const c = palette(t);
    return `<span class="cl-itag" style="background:${c.bg};color:${c.text}" onclick="event.stopPropagation();openItemTagPop(event,'${sec}',${i},'${kind}')">${x(t.name)}</span>`;
  }
  return `<button class="cl-tag-slot" onclick="event.stopPropagation();openItemTag('${sec}',${i},'${kind}',this)">+</button>`;
}

function drawList(sec) {
  const el = document.getElementById('list-' + sec);
  if (!el) return;
  el.innerHTML = items[sec].map((item, i) =>
    `<div class="cl-item" id="item-${sec}-${i}">
      <div class="cl-td"><span class="cl-text" onclick="editItem('${sec}',${i},this)">${x(item.text)}</span></div>
      <div class="cl-td-tag">${tagSlot(sec, i, item, 'project')}</div>
      <div class="cl-td-tag">${tagSlot(sec, i, item, 'type')}</div>
      <div class="cl-td-del"><button class="cl-del" onclick="delItem('${sec}',${i})">×</button></div>
    </div>`
  ).join('');
}

function editItem(sec, i, span) {
  const item = items[sec][i];
  const inp = document.createElement('input');
  inp.className = 'cl-edit-input';
  inp.value = item.text;
  span.replaceWith(inp);
  inp.focus();
  inp.select();

  let committed = false;
  function commit(insertAfter) {
    if (committed) return;
    committed = true;
    const v = inp.value.trim();
    if (v) item.text = v;
    else items[sec].splice(i, 1);
    if (insertAfter) {
      const newIdx = v ? i + 1 : i;
      items[sec].splice(newIdx, 0, { text: '', done: false, level: item.level });
      drawList(sec);
      editItem(sec, newIdx, document.querySelector(`#item-${sec}-${newIdx} .cl-text`));
    } else {
      drawList(sec);
    }
  }

  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); commit(true); }
    if (e.key === 'Escape') { committed = true; drawList(sec); }
  });
  inp.addEventListener('blur', () => commit(false));
}


function addItem(sec) {
  const el = document.getElementById('in-' + sec);
  const v = el.value.trim();
  if (!v) return;
  items[sec].push({ text: v, done: false, level: 0 });
  drawList(sec);
  el.value = '';
  el.focus();
}

function delItem(sec, i) {
  items[sec].splice(i, 1);
  drawList(sec);
}

function onItemKey(e, sec) {
  if (e.key === 'Enter' && !e.isComposing) {
    e.preventDefault();
    addItem(sec);
  }
}

// ─── Tags ─────────────────────────────────────────────────────────────────────
let itemTagTarget = null;

function getAllUsedTags() {
  return Object.values(knownTags).sort((a, b) => (a.createdAt ?? Infinity) - (b.createdAt ?? Infinity));
}

function updateSuggest() {
  const el = document.getElementById('tag-in');
  const query = el.value.trim().toLowerCase();
  const all = getAllUsedTags();
  const filtered = all.filter(t =>
    (query === '' || t.name.toLowerCase().includes(query)) &&
    (!itemTagTarget || !t.kind || t.kind === itemTagTarget.kind)
  );

  const chipsEl = document.getElementById('tag-pop-chips');
  chipsEl.innerHTML = filtered.map(t => {
    const c = palette(t);
    return `<div style="display:flex;align-items:center;gap:4px">
      <button class="tag-pop-chip" style="background:${c.bg};color:${c.text};flex:1"
        onmousedown="event.preventDefault();pickSuggest('${x(t.name)}',${t.color ?? 0})">${x(t.name)}</button>
      <button class="tag-del-btn" onmousedown="event.preventDefault();deleteKnownTag('${x(t.name)}')" title="삭제">×</button>
    </div>`;
  }).join('');
}

function pickSuggest(name, color) {
  if (!itemTagTarget) return;
  const kind = itemTagTarget.kind;
  knownTags[name] = { ...knownTags[name], kind };
  persistTags();
  const item = items[itemTagTarget.sec][itemTagTarget.i];
  item[tagField(kind)] = { name, color };
  persist();
  drawList(itemTagTarget.sec);
  const el = document.getElementById('tag-in');
  el.value = '';
  el.focus();
  updateSuggest();
}

function deleteKnownTag(name) {
  delete knownTags[name];
  persistTags();
  updateSuggest();
}

function closeSuggest() {
  document.getElementById('item-tag-wrap').classList.remove('on');
  document.getElementById('tag-pop-chips').innerHTML = '';
  itemTagTarget = null;
}

document.addEventListener('click', e => {
  if (!e.target.closest('#item-tag-wrap') && !e.target.closest('.cl-tag-btn')) closeSuggest();
});

function addTag() {
  if (!itemTagTarget) return;
  const el = document.getElementById('tag-in');
  const v = el.value.trim();
  if (!v) return;
  const color = knownTags[v] ? knownTags[v].color : 0;
  const kind = itemTagTarget.kind;
  knownTags[v] = { name: v, color, kind, createdAt: Date.now() };
  persistTags();
  const item = items[itemTagTarget.sec][itemTagTarget.i];
  item[tagField(kind)] = { name: v, color };
  persist();
  drawList(itemTagTarget.sec);
  el.value = '';
  el.focus();
  updateSuggest();
}

function openItemTag(sec, i, kind, btn) {
  itemTagTarget = { sec, i, kind };
  const wrap = document.getElementById('item-tag-wrap');
  const cellRect = (btn.closest('.cl-td-tag') || btn).getBoundingClientRect();
  const wrapW = Math.max(cellRect.width, 120);
  const left = Math.min(cellRect.left, window.innerWidth - wrapW - 8);
  wrap.style.width = wrapW + 'px';
  wrap.style.top  = (cellRect.bottom + 2) + 'px';
  wrap.style.left = left + 'px';
  wrap.classList.add('on');
  const el = document.getElementById('tag-in');
  el.value = '';
  el.focus();
  updateSuggest();
}

function openItemTagPop(e, sec, i, kind) {
  e.stopPropagation();
  const item = items[sec][i];
  const tag = item[tagField(kind)];
  if (!tag) return;
  itemTagTarget = { sec, i, kind };
  const pop = document.getElementById('tag-pop');
  pop.innerHTML = `
    <div class="pop-name">${x(tag.name)}</div>
    <button class="pop-del" onclick="rmItemTag('${sec}',${i},'${kind}')">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M6 2h4a1 1 0 0 0-2 0H6a1 1 0 0 0-2 0zm-2 2h8l-.8 9H4.8L4 4zm2 2v5h1V6H6zm3 0v5h1V6H9z"/></svg>
      삭제
    </button>
    <div class="pop-colors-label">색상</div>
    ${TAG_PALETTE.map((c, ci) => `
      <div class="pop-color-row" onclick="setItemTagColor('${sec}',${i},'${kind}',${ci})">
        <div class="pop-swatch" style="background:${c.bg};outline:1px solid ${c.text}33"></div>
        <span class="pop-color-name">${c.name}</span>
        <span class="pop-check">${tag.color === ci ? '✓' : ''}</span>
      </div>
    `).join('')}
  `;
  const rect = e.currentTarget.getBoundingClientRect();
  pop.style.top  = (rect.bottom + 6) + 'px';
  pop.style.left = Math.min(rect.left, window.innerWidth - 200) + 'px';
  pop.classList.add('on');
}

function rmItemTag(sec, i, kind) {
  delete items[sec][i][tagField(kind)];
  persist();
  drawList(sec);
  closeTagPop();
}

function setItemTagColor(sec, i, kind, ci) {
  const item = items[sec][i];
  const f = tagField(kind);
  if (!item[f]) return;
  item[f].color = ci;
  const n = item[f].name;
  if (n) {
    knownTags[n] = { ...knownTags[n], name: n, color: ci };
    persistTags();
    Object.values(logs).forEach(e => {
      (e.tItems || []).forEach(it => {
        if (it.projectTag?.name === n) it.projectTag.color = ci;
        if (it.typeTag?.name === n) it.typeTag.color = ci;
      });
    });
    persist();
  }
  drawList(sec);
  closeTagPop();
}

function onTagKey(e) {
  if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); addTag(); return; }
  if (e.key === 'Escape') { closeSuggest(); return; }
}

function collectEntry(isDraft) {
  return {
    date: key(curDate),
    y: items.y.map(i => i.text),
    t: items.t.map(i => i.text),
    yItems: [...items.y],
    tItems: [...items.t],
    tags: [...tags],
    memo: {
      comm: document.getElementById('m-comm').value,
      dec:  document.getElementById('m-dec').value,
      next: document.getElementById('m-next').value,
    },
    isDraft,
    saved: new Date().toISOString(),
  };
}

// ─── History ──────────────────────────────────────────────────────────────────
let historyShowAll = false;

function renderFilterTagChips() {
  const container = document.getElementById('filter-tag-chips');
  const current = document.getElementById('f-tag').value.trim().toLowerCase();
  const tags = getAllUsedTags();
  const filtered = current ? tags.filter(t => t.name.toLowerCase().includes(current)) : tags;
  if (!filtered.length) { container.classList.remove('on'); return; }
  container.innerHTML = filtered.map(t => {
    const c = palette(t);
    const sel = current === t.name.toLowerCase() ? ' selected' : '';
    return `<span class="filter-tag-chip${sel}" style="background:${c.bg};color:${c.text}"
      onmousedown="event.preventDefault();pickFilterTag('${x(t.name)}')">${x(t.name)}</span>`;
  }).join('');
  container.classList.add('on');
}

function pickFilterTag(name) {
  const inp = document.getElementById('f-tag');
  inp.value = inp.value.trim().toLowerCase() === name.toLowerCase() ? '' : name;
  drawHistory();
  renderFilterTagChips();
}

function drawHistory() {
  const fTag = document.getElementById('f-tag').value.trim().toLowerCase();
  let entries = Object.values(logs).sort((a,b) => b.date.localeCompare(a.date));

  if (fTag) entries = entries.filter(e => {
    const dayMatch = (e.tags||[]).some(t => tagName(t).toLowerCase().includes(fTag));
    const itemMatch = (e.tItems||[]).some(it =>
      it.projectTag?.name.toLowerCase().includes(fTag) ||
      it.typeTag?.name.toLowerCase().includes(fTag)
    );
    return dayMatch || itemMatch;
  });

  const el = document.getElementById('h-list');
  if (!entries.length) {
    el.innerHTML = `<div class="empty-msg"><strong>기록이 없습니다</strong>조건을 바꾸거나 새 기록을 작성해보세요</div>`;
    return;
  }

  // Week bucket label
  function weekDiff(dateStr) {
    const now = new Date();
    const dow = now.getDay();
    const thisMonday = new Date(now);
    thisMonday.setDate(now.getDate() - (dow === 0 ? 6 : dow - 1));
    thisMonday.setHours(0, 0, 0, 0);
    const d = new Date(dateStr + 'T00:00:00');
    const dDow = d.getDay();
    const dMonday = new Date(d);
    dMonday.setDate(d.getDate() - (dDow === 0 ? 6 : dDow - 1));
    dMonday.setHours(0, 0, 0, 0);
    return Math.round((thisMonday - dMonday) / (7 * 86400000));
  }

  function weekLabel(dateStr) {
    const diff = weekDiff(dateStr);
    if (diff === 0) return '이번 주';
    if (diff === 1) return '지난 주';
    if (diff === 2) return '2주 전';
    if (diff === 3) return '3주 전';
    const d = new Date(dateStr + 'T00:00:00');
    return `${d.getFullYear()}년 ${d.getMonth()+1}월`;
  }

  const isFiltering = !!fTag;
  const recent  = isFiltering ? entries : entries.filter(e => weekDiff(e.date) <= 2);
  const older   = isFiltering ? []      : entries.filter(e => weekDiff(e.date) >= 3);
  const visible = historyShowAll ? entries : recent;

  let lastLabel = null;
  const parts = [];
  visible.forEach(e => {
    const lbl = weekLabel(e.date);
    if (lbl !== lastLabel) {
      parts.push(`<div class="h-week-label">${lbl}</div>`);
      lastLabel = lbl;
    }
    const d = new Date(e.date + 'T00:00:00');
    const tArr = (e.tItems||e.t||[]).filter(i => (i.level ?? 0) === 0);
    const previewItems = tArr.slice(0,3);
    const previewHtml = previewItems.length
      ? previewItems.map(it => {
          const t = itemText(it);
          if (!t) return '';
          const chips = [it.projectTag, it.typeTag].filter(Boolean).map(tg => {
            const c = palette(tg);
            return `<span style="flex-shrink:0;background:${c.bg};color:${c.text};font-size:10px;padding:1px 7px;border-radius:20px;white-space:nowrap">${x(tg.name)}</span>`;
          }).join('');
          return `<div class="h-preview-row"><span class="h-preview-text">${x(t)}</span>${chips}</div>`;
        }).filter(Boolean).join('')
      : '';
    parts.push(`<div class="h-entry" onclick="openModal('${e.date}')">
      <div class="h-top">
        <div class="h-date">${x(koDate(d))}<span class="h-day">${x(koDow(d))}</span></div>
      </div>
      <div class="h-preview">${previewHtml || '<em style="opacity:.5">내용 없음</em>'}</div>
      <div class="h-meta">
        ${(() => { const c=e.memo?.comm?.trim(),d=e.memo?.dec?.trim(),n=e.memo?.next?.trim();
          if (!c&&!d&&!n) return '<div class="h-stat" style="opacity:.3">☁️</div><div class="h-stat" style="opacity:.3">🐶</div><div class="h-stat" style="opacity:.3">🌿</div>';
          return (c?`<div class="h-stat h-diary-text">${x(c)}</div>`:'')+(d?`<div class="h-stat h-diary-text">${x(d)}</div>`:'')+(n?`<div class="h-stat h-diary-text">${x(n)}</div>`:'');
        })()}
        <div style="flex:1"></div>
        <button class="h-del-btn" id="del-${e.date}" onclick="event.stopPropagation();confirmDelete(this,'${e.date}')" title="삭제">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
            <path d="M6.5 1a.5.5 0 0 0 0 1h3a.5.5 0 0 0 0-1h-3zM2 3.5a.5.5 0 0 1 .5-.5h11a.5.5 0 0 1 0 1H13v8a1.5 1.5 0 0 1-1.5 1.5h-7A1.5 1.5 0 0 1 3 12.5V4H2.5a.5.5 0 0 1-.5-.5zm2 .5v8a.5.5 0 0 0 .5.5h7a.5.5 0 0 0 .5-.5V4H4zm2 1.5a.5.5 0 0 1 .5.5v5a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm3 0a.5.5 0 0 1 .5.5v5a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5z"/>
          </svg>
        </button>
      </div>
    </div>`);
  });
  if (!historyShowAll && older.length) {
    parts.push(`<div class="h-load-more" onclick="historyShowAll=true;drawHistory()">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M5 7.5L10 12.5L15 7.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>${older.length}개 더 보기</span>
    </div>`);
  }
  el.innerHTML = parts.join('');
}

// ─── Modal ────────────────────────────────────────────────────────────────────
function openModal(dateStr) {
  const e = logs[dateStr]; if (!e) return;
  const d = new Date(dateStr + 'T00:00:00');
  document.getElementById('m-title').textContent = koDate(d);

  let html = '';

  const yList = e.yItems || (e.y||[]).map(t=>({text:t,done:false}));
  const tList = e.tItems || (e.t||[]).map(t=>({text:t,done:false}));

  const renderModalList = (list, color) => list.map(i =>
    `<li style="${i.level?'padding-left:20px':''}">`+
    `<div class="m-dot" style="background:${color};opacity:${i.done?.5:1};${i.level?'width:3px;height:3px':''}"></div>`+
    `<span style="${i.done?'text-decoration:line-through;opacity:.45':''}${i.level?';font-size:13px;color:var(--text-2)':''}">${x(i.text)}</span></li>`
  ).join('');

  if (tList.length) html += `<div class="m-section">
    <div class="m-label" style="color:var(--t-c)">오늘 업무</div>
    <ul class="m-list">${renderModalList(tList,'var(--t-c)')}</ul></div>`;

  if (e.tags.length) html += `<div class="m-section">
    <div class="m-label">프로젝트 태그</div>
    <div class="m-chips">${e.tags.map(t => { const c=palette(t); return `<div class="chip" style="background:${c.bg};color:${c.text}">${x(tagName(t))}</div>`; }).join('')}</div>
  </div>`;

  const memos = [
    ['커뮤니케이션 이슈', e.memo?.comm],
    ['한 줄 일기',          e.memo?.dec],
    ['배운점',            e.memo?.next],
  ];
  memos.forEach(([label, val]) => {
    if (val?.trim()) html += `<div class="m-section">
      <div class="m-label">${x(label)}</div>
      <div class="m-text">${x(val)}</div>
    </div>`;
  });

  if (!html) html = '<p style="color:var(--text-3);text-align:center;padding:24px">내용이 없습니다</p>';

  document.getElementById('m-body').innerHTML = html;
  document.getElementById('overlay').classList.add('on');
}

function closeModal() { document.getElementById('overlay').classList.remove('on'); }

// ─── 성과 / AI 회고 ────────────────────────────────────────────────────────────
let perfYear  = new Date().getFullYear();
let perfMonth = new Date().getMonth() + 1;

function perfShiftMonth(n) {
  perfMonth += n;
  if (perfMonth > 12) { perfMonth = 1;  perfYear++; }
  if (perfMonth < 1)  { perfMonth = 12; perfYear--; }
  drawPerfReport();
}

function drawPerfReport() {
  document.getElementById('perf-month-label').textContent = `${perfYear}년 ${perfMonth}월`;
  document.getElementById('perf-prompt-box').style.display = 'none';

  const prefix  = `${perfYear}-${String(perfMonth).padStart(2,'0')}`;
  const entries = Object.values(logs)
    .filter(e => e.date.startsWith(prefix) && (
      (e.tItems||e.t||[]).length ||
      e.memo?.comm?.trim() || e.memo?.dec?.trim() || e.memo?.next?.trim()
    ))
    .sort((a,b) => a.date.localeCompare(b.date));

  const summaryEl = document.getElementById('perf-summary');

  if (!entries.length) {
    summaryEl.innerHTML = `<div class="perf-empty">이 달의 기록이 없어요 🌿</div>`;
    return;
  }

  // 태그 빈도 집계 (업무 단위 태그 우선, 없으면 날짜 태그 fallback)
  const tagCount = new Map();
  entries.forEach(e => {
    const itemTags = (e.tItems||[]).flatMap(it => [it.projectTag, it.typeTag].filter(Boolean));
    const source = itemTags.length ? itemTags : (e.tags||[]);
    source.forEach(t => {
      const n = tagName(t);
      tagCount.set(n, (tagCount.get(n) || 0) + 1);
    });
  });
  const sortedTags = [...tagCount.entries()].sort((a, b) => b[1] - a[1]);

  const tagChips = sortedTags.length
    ? sortedTags.map(([n, cnt]) => {
        const c = palette(knownTags[n]);
        return `<span class="perf-doc-tag" style="background:${c.bg};color:${c.text};border-color:transparent">${x(n)} <span style="opacity:.55;font-weight:400">${cnt}</span></span>`;
      }).join('')
    : `<span class="perf-doc-empty-item">태그 없음</span>`;

  summaryEl.innerHTML = `
    <div class="perf-doc">
      <div class="perf-doc-row">
        <div>
          <div class="perf-doc-stat-label">총 기록</div>
          <div class="perf-doc-stat-val">${entries.length}일</div>
        </div>
      </div>
      <hr class="perf-doc-divider">
      <div class="perf-doc-section">
        <div class="perf-doc-section-title">프로젝트</div>
        <div class="perf-doc-tags">${tagChips}</div>
      </div>
      <button class="perf-gen-btn" onclick="generatePerfPrompt()">✨ AI 회고 프롬프트 만들기</button>
    </div>
  `;
}


function generatePerfPrompt() {
  const prefix  = `${perfYear}-${String(perfMonth).padStart(2,'0')}`;
  const entries = Object.values(logs)
    .filter(e => e.date.startsWith(prefix))
    .sort((a,b) => a.date.localeCompare(b.date));

  // 날짜별 데이터 정리
  const lines = entries.map(e => {
    const tItems = e.tItems || (e.t||[]).map(t => ({text:t,done:false,level:0}));
    const tags   = (e.tags||[]).map(t => tagName(t)).join(', ');
    const items  = tItems.map(i => {
      const parts = [i.projectTag?.name, i.typeTag?.name].filter(Boolean);
      return `  - ${itemText(i)}${parts.length ? ` [${parts.join(', ')}]` : ''}`;
    }).join('\n');
    const comm   = e.memo?.comm?.trim();
    const diary  = e.memo?.dec?.trim();
    const lunch  = e.memo?.next?.trim();
    let memo = '';
    if (comm)  memo += `\n  커뮤니케이션: ${comm}`;
    if (diary) memo += `\n  한 줄 일기: ${diary}`;
    if (lunch) memo += `\n  배운점: ${lunch}`;
    return `[${e.date}]${tags ? ` (${tags})` : ''}\n${items}${memo}`;
  }).join('\n\n');

  const prompt =
`당신은 성장을 돕는 팀 매니저입니다. 온화하고 명확하고 통찰력이 좋은 성격입니다.

아래는 제가 ${perfYear}년 ${perfMonth}월에 기록한 업무 워크로그입니다.

---
${lines}
---

이 데이터를 바탕으로 다음 내용을 회고 형식으로 작성해주세요:

1. **이달의 주요 업무 요약** — 어떤 프로젝트에 집중했는지 전체적인 흐름
2. **잘한 점** — 구체적인 업무 내용을 근거로 칭찬
3. **돌아보면 좋을 점** — 부드럽게, 성장의 관점에서
4. **다음 달을 위한 한마디**

줄글 형식으로, 따뜻하고 통찰력 있게 작성해주세요.`;

  const ta = document.getElementById('perf-prompt-ta');
  const box = document.getElementById('perf-prompt-box');
  ta.value = prompt;
  box.style.display = 'flex';
  box.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function copyPerfPrompt() {
  const ta = document.getElementById('perf-prompt-ta');
  ta.select();
  try {
    document.execCommand('copy');
    const btn = document.getElementById('perf-copy-btn');
    btn.textContent = '✓ 복사됐어요!';
    setTimeout(() => btn.textContent = '📋 프롬프트 복사', 2000);
  } catch(e) {
    toast('텍스트를 직접 선택해서 복사하세요');
  }
}

// ─── Data export / import ──────────────────────────────────────────────────────
function openDataModal() {
  document.getElementById('import-input').value = '';
  document.getElementById('export-output').value = '';
  renderMdMonthList();
  document.getElementById('data-overlay').classList.add('on');
}

function renderMdMonthList() {
  const container = document.getElementById('md-month-list');
  // 연도-월별로 그룹핑
  const grouped = {};
  Object.values(logs).forEach(e => {
    const [y, m] = e.date.split('-');
    const yk = y, mk = m;
    if (!grouped[yk]) grouped[yk] = {};
    if (!grouped[yk][mk]) grouped[yk][mk] = 0;
    grouped[yk][mk]++;
  });

  const years = Object.keys(grouped).sort((a,b) => b - a);
  if (!years.length) {
    container.innerHTML = '<div style="font-size:13px;color:var(--text-3)">저장된 기록이 없어요</div>';
    return;
  }

  const parts = [];
  years.forEach(y => {
    parts.push(`<div class="md-year-label">${y}년</div>`);
    const months = Object.keys(grouped[y]).sort((a,b) => a - b);
    months.forEach(m => {
      const count = grouped[y][m];
      const label = `${String(m).padStart(2,'0')}월`;
      parts.push(`
        <div class="md-month-row">
          <div>
            <div class="md-month-name">📄 ${label}.md</div>
            <div class="md-month-count">${count}일 기록</div>
          </div>
          <button class="md-dl-btn" onclick="downloadMd('${y}','${m}')">↓ 저장</button>
        </div>`);
    });
  });
  container.innerHTML = parts.join('');
}

async function downloadMd(year, month) {
  const prefix = `${year}-${String(month).padStart(2,'0')}`;
  const entries = Object.values(logs)
    .filter(e => e.date.startsWith(prefix))
    .sort((a,b) => a.date.localeCompare(b.date));

  const DOW = ['일','월','화','수','목','금','토'];
  const lines = [`# ${year}년 ${Number(month)}월 워크로그\n`];

  entries.forEach(e => {
    const d = new Date(e.date + 'T00:00:00');
    const dow = DOW[d.getDay()];
    lines.push(`## ${e.date} (${dow})`);

    const etags = (e.tags||[]).map(t => tagName(t));
    if (etags.length) lines.push(`> 태그: ${etags.join(', ')}\n`);

    const tItems = e.tItems || (e.t||[]).map(t => ({text:t,done:false,level:0}));
    if (tItems.length) {
      tItems.forEach(i => {
        const indent = '  '.repeat(i.level||0);
        lines.push(`${indent}- ${itemText(i)}`);
      });
    }

    const comm  = e.memo?.comm?.trim();
    const diary = e.memo?.dec?.trim();
    const lunch = e.memo?.next?.trim();
    lines.push('');
    lines.push('### 메모');
    lines.push(`- 📚 배운점: ${lunch || '—'}`);
    lines.push(`- ☁️ 커뮤니케이션: ${comm || '—'}`);
    lines.push(`- 🐶 한 줄 일기: ${diary || '—'}`);
    lines.push('\n---\n');
  });

  const content  = lines.join('\n');
  const filename = `${year}-${String(month).padStart(2,'0')}월.md`;
  const blob = new Blob([content], { type: 'text/markdown;charset=utf-8' });

  if (window.showSaveFilePicker) {
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: filename,
        types: [{ description: 'Markdown 파일', accept: { 'text/markdown': ['.md'] } }],
      });
      const writable = await handle.createWritable();
      await writable.write(blob);
      await writable.close();
      toast(`${filename} 저장됐어요 ✓`);
    } catch(e) {
      if (e.name !== 'AbortError') toast('저장 실패: ' + e.message);
    }
  } else {
    const url = URL.createObjectURL(blob);
    const a   = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast(`${filename} 저장됐어요 ✓`);
  }
}
function closeDataModal() {
  document.getElementById('data-overlay').classList.remove('on');
}
function exportData() {
  const payload = JSON.stringify({ logs, knownTags });
  const ta = document.getElementById('export-output');
  ta.value = payload;
  ta.select();
  ta.focus();
  try {
    document.execCommand('copy');
    toast('클립보드에 복사됐어요 ✓');
  } catch(e) {
    toast('위 텍스트를 길게 눌러 복사하세요');
  }
}
function importData() {
  const raw = document.getElementById('import-input').value.trim();
  if (!raw) { toast('붙여넣은 데이터가 없어요'); return; }
  try {
    const parsed = JSON.parse(raw);
    if (!parsed.logs) throw new Error();
    logs = parsed.logs;
    if (parsed.knownTags) knownTags = parsed.knownTags;
    persist();
    persistTags();
    closeDataModal();
    loadEntry();
    drawHistory();
    toast('데이터를 불러왔어요 ✓');
  } catch(e) {
    toast('데이터 형식이 올바르지 않아요');
  }
}
function maybeClose(e) { if (e.target === document.getElementById('overlay')) closeModal(); }

// ─── Toast ────────────────────────────────────────────────────────────────────
let _toastTimer;
function toast(msg) {
  clearTimeout(_toastTimer);
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('on');
  _toastTimer = setTimeout(() => el.classList.remove('on'), 2200);
}

// ─── Utils ────────────────────────────────────────────────────────────────────
function tagName(t) { return typeof t === 'string' ? t : t.name; }

function itemText(i) { return typeof i === 'string' ? i : i.text; }

function x(s) {
  return String(s??'')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─── Keyboard shortcut ────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 's') {
    e.preventDefault();
    if (curTab === 'input') saveLog();
  }
  if (e.key === 'Escape') closeModal();
});

(async () => {
  refreshDateUI();
  loadEntry();
  await load();
})();

setInterval(() => {
  const entry = collectEntry(true);
  const hasContent = entry.tItems.length || entry.tags.length ||
    entry.memo.comm?.trim() || entry.memo.dec?.trim() || entry.memo.next?.trim();
  if (!hasContent) return;
  logs[key(curDate)] = entry;
  persist();
}, 5000);
</script>
